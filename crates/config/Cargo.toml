[package]
name = "streamdelay-config"
description = "Configuration file and secret storage for stream-delay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["keychain"]
# Store secrets in the OS keychain (falls back to a private file when unavailable).
keychain = ["dep:keyring"]

[dependencies]
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
rand.workspace = true
toml = "1"
streamdelay-engine.workspace = true
directories = "6"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", optional = true, features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", optional = true, features = ["windows-native"] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", optional = true, features = ["sync-secret-service", "crypto-rust", "vendored"] }

[dev-dependencies]
tempfile = "3"

# The workspace forbids unsafe code. This crate only denies it, so that the one
# module that needs it can allow it: setting a file's access list on Windows
# (`write_private`), which the standard library has no safe API for.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
