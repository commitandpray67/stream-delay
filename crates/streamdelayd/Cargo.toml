[package]
name = "streamdelayd"
description = "stream-delay headless daemon and command-line client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
streamdelay-relay.workspace = true
streamdelay-control.workspace = true
streamdelay-config.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde_json.workspace = true
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
toml = "1"
ureq = { version = "3", default-features = false, features = ["json"] }
dhat = { version = "0.3", optional = true }

[features]
# Heap profiling for leak hunting: writes dhat-heap.json when `run` exits
# (Ctrl-C). View it at https://nnethercote.github.io/dh_view/dh_view.html.
dhat-heap = ["dep:dhat"]

[lints]
workspace = true
