[package]
name = "streamdelay-relay"
description = "tokio runtime for stream-delay: RTMP ingest server, egress client and delay engine task"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
streamdelay-rtmp.workspace = true
streamdelay-engine.workspace = true
bytes.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
socket2 = "0.6"
subtle = "2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
webpki-roots = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock"] }

[dev-dependencies]
proptest.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber.workspace = true

# As the workspace, but `unsafe` may be allowed where needed: see heap.rs.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
