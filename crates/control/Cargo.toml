[package]
name = "streamdelay-control"
description = "Local HTTP/WebSocket control API and embedded web UI for stream-delay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
streamdelay-relay.workspace = true
streamdelay-config.workspace = true
streamdelay-obs.workspace = true
rust-embed = { version = "8", features = ["mime-guess"] }
axum = { version = "0.8", features = ["ws"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror.workspace = true
subtle = "2"
rand.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[dev-dependencies]
tempfile = "3"
streamdelay-config.workspace = true
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints]
workspace = true
