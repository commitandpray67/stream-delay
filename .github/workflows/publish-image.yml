name: Publish container image

# Pushes ghcr.io/<owner>/stream-delay:<version> (and :edge) once a release is
# published, packaging the Linux archives attached to it, after checking them
# against its SHA256SUMS.txt. Nothing is pushed for a draft, so an image never
# goes out for a release that was not reviewed and published. Run it by hand to
# push the image of an already published release again.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.3.0
        required: true

permissions:
  contents: read

jobs:
  image:
    name: Container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TAG }}
      - name: Download and check the release's Linux binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir release && cd release
          gh release download "$TAG" --pattern 'streamdelayd-*-unknown-linux-gnu.tar.gz' --pattern SHA256SUMS.txt
          ls -l
          test "$(ls streamdelayd-*-unknown-linux-gnu.tar.gz | wc -l)" -eq 2
          sha256sum --check --ignore-missing --strict SHA256SUMS.txt
      - name: Arrange binaries by architecture
        run: |
          for pair in amd64:x86_64 arm64:aarch64; do
            arch=${pair%%:*}; target=${pair#*:}
            mkdir -p "dist/$arch" extract
            tar xzf release/streamdelayd-*-"$target"-unknown-linux-gnu.tar.gz -C extract
            cp extract/streamdelayd-*-"$target"-unknown-linux-gnu/streamdelayd "dist/$arch/"
          done
          ls -l dist/*
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=raw,value=edge
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
