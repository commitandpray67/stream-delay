name: Release

# Push a tag like v0.1.0 to build installers and headless binaries. The tag's
# commit must pass CI first. Everything lands in a draft GitHub release, which is
# checked (every asset there, every update signed with the project's key) before
# its checksums are added; publish it as a normal release (not a pre-release),
# since the updater only looks at the latest full release. Publishing it pushes
# the container image (publish-image.yml): nothing is public before that.
#
# Pushes to main or claude/** that touch the release setup run the same builds as
# a dry run: installers and binaries are uploaded as artifacts of the workflow run
# (downloadable from its page) and nothing is published.
#
# The signing secrets (updater key, Apple credentials) belong in the `release`
# environment, which only v* tags may use (docs/RELEASING.md). A branch push can
# change this file, so dry runs never see them: they sign with a key made for
# the run.
on:
  push:
    tags: ["v*"]
    branches: [main, "claude/**"]
    paths:
      - ".github/workflows/release.yml"
      - ".github/scripts/verify_release.py"
      - "Dockerfile.release"
      - "apps/desktop/src-tauri/tauri.conf.json"
  workflow_dispatch:

# Jobs ask for more only where they publish.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The tagged commit must pass everything CI checks, whatever happened on main.
  ci:
    name: CI
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/ci.yml

  checks:
    name: Release checks
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: The tag matches the version everywhere
        run: |
          v="${GITHUB_REF_NAME#v}"
          fail=0
          check() {
            if [ "$2" != "$v" ]; then
              echo "::error::$1 says version '$2', the tag says $v"
              fail=1
            fi
          }
          check Cargo.toml "$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          for f in apps/desktop/src-tauri/tauri.conf.json apps/desktop/package.json ui/package.json; do
            check "$f" "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$f")"
          done
          grep -q "^## \[$v\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $v"; fail=1; }
          exit $fail

  desktop:
    name: Desktop (${{ matrix.name }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ci, checks]
    environment: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            args: ""
          - name: Windows
            os: windows-latest
            args: ""
          - name: macOS (universal)
            os: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Build the web UI
        run: pnpm -C ui install --frozen-lockfile && pnpm -C ui build
      - name: Install the Tauri CLI
        run: pnpm -C apps/desktop install --frozen-lockfile
      - name: Updater configuration
        id: updater
        shell: bash
        env:
          PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          # Without the key pair, the app would be built without its updater, and
          # installed copies could never update again (docs/RELEASING.md).
          if [ -z "$PUBKEY" ] || [ "$HAS_SIGNING_KEY" != true ]; then
            echo "::error::A release needs the updater keys: the repository variable TAURI_UPDATER_PUBKEY and the secret TAURI_SIGNING_PRIVATE_KEY of the release environment."
            exit 1
          fi
          printf '{"bundle":{"createUpdaterArtifacts":true},"plugins":{"updater":{"pubkey":"%s"}}}' "$PUBKEY" \
            > apps/desktop/src-tauri/tauri.release.conf.json
          echo "args=--config src-tauri/tauri.release.conf.json" >> "$GITHUB_OUTPUT"
      # macOS signing and notarization (optional until an Apple Developer ID is set
      # up). Tauri imports a certificate whenever APPLE_CERTIFICATE is set, even to
      # the empty value a missing secret gives, and then fails the build; so the
      # Apple settings are passed on only when a certificate is configured.
      - name: Apple signing, if configured
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning::No Apple certificate is configured: the macOS app is not signed or notarized."
            exit 0
          fi
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value=$(printenv "$name" || true)
            [ -n "$value" ] || continue
            delim="EOF_$(openssl rand -hex 16)"
            { echo "$name<<$delim"; echo "$value"; echo "$delim"; } >> "$GITHUB_ENV"
          done
      - name: Build and attach to the draft release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: stream-delay ${{ github.ref_name }}
          releaseBody: See CHANGELOG.md for what changed. Checksums are in SHA256SUMS.txt.
          releaseDraft: true
          # The updater follows releases/latest, which skips pre-releases.
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }} ${{ steps.updater.outputs.args }}

  desktop-dry-run:
    name: Desktop dry run (${{ matrix.name }})
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            args: ""
            bundle: target/release/bundle
          - name: Windows
            os: windows-latest
            args: ""
            bundle: target/release/bundle
          - name: macOS (universal)
            os: macos-latest
            args: "--target universal-apple-darwin"
            bundle: target/universal-apple-darwin/release/bundle
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Build the web UI
        run: pnpm -C ui install --frozen-lockfile && pnpm -C ui build
      - name: Install the Tauri CLI
        run: pnpm -C apps/desktop install --frozen-lockfile
      - name: Throwaway updater key
        id: updater
        shell: bash
        run: |
          # Sign like a release, with a key that exists only for this run, so the
          # check below proves every platform produces signed update bundles.
          # (A relative path: Windows paths trip up Git Bash.)
          pnpm -C apps/desktop tauri signer generate --ci -w dry-run-updater.key >/dev/null
          printf '{"bundle":{"createUpdaterArtifacts":true},"plugins":{"updater":{"pubkey":"%s"}}}' \
            "$(cat apps/desktop/dry-run-updater.key.pub)" \
            > apps/desktop/src-tauri/tauri.release.conf.json
          echo "args=--config src-tauri/tauri.release.conf.json" >> "$GITHUB_OUTPUT"
          echo "TAURI_SIGNING_PRIVATE_KEY=$(cat apps/desktop/dry-run-updater.key)" >> "$GITHUB_ENV"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=" >> "$GITHUB_ENV"
      - name: Build
        shell: bash
        run: pnpm -C apps/desktop tauri build ${{ matrix.args }} ${{ steps.updater.outputs.args }}
      - name: Upload installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-${{ runner.os }}
          path: |
            ${{ matrix.bundle }}/**/*.exe
            ${{ matrix.bundle }}/**/*.msi
            ${{ matrix.bundle }}/**/*.dmg
            ${{ matrix.bundle }}/**/*.AppImage
            ${{ matrix.bundle }}/**/*.deb
            ${{ matrix.bundle }}/**/*.rpm
            ${{ matrix.bundle }}/**/*.sig
          if-no-files-found: error
      - name: Check update signatures
        shell: bash
        run: |
          # Every platform must produce update bundles signed with the key it was
          # given, or installed copies could not update to a release built this way.
          # On Windows, python3 can be the Microsoft Store placeholder.
          if [ "$RUNNER_OS" = Windows ]; then py=python; else py=python3; fi
          PUBKEY="$(cat apps/desktop/dry-run-updater.key.pub)" \
            "$py" .github/scripts/verify_release.py signatures "${{ matrix.bundle }}"

  headless:
    name: streamdelayd (${{ matrix.target }})
    needs: [ci, checks]
    # Dry runs skip the checks above; releases need them to pass.
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, exe: streamdelayd }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, exe: streamdelayd }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, exe: streamdelayd.exe }
          - { os: macos-latest, target: aarch64-apple-darwin, exe: streamdelayd }
          # Intel Macs: cross-compiled, as GitHub no longer offers Intel runners.
          - { os: macos-latest, target: x86_64-apple-darwin, exe: streamdelayd }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: pnpm -C ui install --frozen-lockfile && pnpm -C ui build
      - run: cargo build --release -p streamdelayd --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME//\//-}"
          name="streamdelayd-$version-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/${{ matrix.exe }}" README.md LICENSE docs/API.md "$name"/
          if [ "${{ runner.os }}" = "Windows" ]; then 7z a "$name.zip" "$name" >/dev/null; else tar czf "$name.tar.gz" "$name"; fi
          # Only the archive is uploaded. A tag's name has dots, so a wider
          # pattern also picked up this folder, which the release upload then
          # refused (v0.2.0 lost three archives and its checksums that way).
          rm -rf "$name"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: headless-${{ matrix.target }}
          path: |
            streamdelayd-*.tar.gz
            streamdelayd-*.zip
          if-no-files-found: error

  publish-headless:
    name: Attach binaries and checksums
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, headless]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: headless-*
          merge-multiple: true
          path: headless
      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l headless
          # All five archives, or fail here rather than publish without some.
          test "$(ls headless/streamdelayd-*.tar.gz headless/streamdelayd-*.zip | wc -l)" -eq 5
          gh release upload "${{ github.ref_name }}" headless/streamdelayd-*.tar.gz headless/streamdelayd-*.zip --clobber
      - name: Check the whole release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          mkdir all
          gh release download "${{ github.ref_name }}" --dir all --pattern '*'
          rm -f all/SHA256SUMS.txt
          # Every installer and archive, update signatures made with the project's
          # key, and latest.json offering this version to every platform.
          python3 .github/scripts/verify_release.py release all "${{ github.ref_name }}" "${{ github.repository }}"
      - name: Add checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd all
          sha256sum * > SHA256SUMS.txt
          gh release upload "${{ github.ref_name }}" SHA256SUMS.txt --clobber

  # Builds the image as a check. It is pushed when the release is published
  # (publish-image.yml), from the archives in the release.
  container:
    name: Container image (build only)
    needs: [headless]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: headless-*-linux-gnu
          merge-multiple: true
      # The image packages the binaries built above instead of compiling again,
      # which for arm64 would run under emulation and take an hour.
      - name: Arrange binaries by architecture
        run: |
          for pair in amd64:x86_64 arm64:aarch64; do
            arch=${pair%%:*}; target=${pair#*:}
            mkdir -p "dist/$arch" extract
            tar xzf streamdelayd-*-"$target"-unknown-linux-gnu.tar.gz -C extract
            cp extract/streamdelayd-*-"$target"-unknown-linux-gnu/streamdelayd "dist/$arch/"
          done
          ls -l dist/*
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: false
