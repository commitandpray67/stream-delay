name: Fuzz

# Runs every cargo-fuzz target in fuzz/fuzz_targets for a fixed time. The corpus is
# cached between runs so coverage builds up; crashing inputs are uploaded as an
# artifact. Reproduce locally with `cargo +nightly fuzz run <target> <crash-file>`.
on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: "300"
  pull_request:
    paths:
      - "crates/rtmp/**"
      - "crates/flv/**"
      - "crates/engine/**"
      - "fuzz/**"

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # The sanitizers need nightly; rust-toolchain.toml would otherwise pick stable.
      RUSTUP_TOOLCHAIN: nightly
      # cargo-fuzz builds for the target it was itself built for, and the one the
      # install action provides is a static musl binary; the address sanitizer
      # needs glibc.
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296 # nightly
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Build
        run: cargo fuzz build --target "$TARGET"
      - name: Fuzz
        env:
          PER_TARGET: ${{ inputs.seconds || (github.event_name == 'pull_request' && '60') || '300' }}
        run: |
          for t in $(cargo fuzz list); do
            echo "::group::$t"
            cargo fuzz run --target "$TARGET" "$t" -- -max_total_time="$PER_TARGET"
            echo "::endgroup::"
          done
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
