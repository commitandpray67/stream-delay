name: Soak

# Long-running stream with random delay changes, dumps and encoder crashes
# (tests/soak/run.sh).
# GitHub-hosted runners stop after 6 hours, so the nightly run lasts 2 hours and
# manual runs are capped at 5.5 hours. Run the full 12-hour soak on your own
# machine: `DURATION=43200 tests/soak/run.sh`.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      hours:
        description: Duration in hours (max 5.5)
        default: "2"

permissions:
  contents: read

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Build
        run: cargo build --release -p streamdelayd
      - name: Soak
        env:
          HOURS: ${{ inputs.hours || '2' }}
          OUT: ${{ runner.temp }}/soak
        # The input is read as data, never pasted into code.
        run: |
          DURATION=$(python3 -c 'import os; print(int(min(float(os.environ["HOURS"]), 5.5) * 3600))') tests/soak/run.sh
      - name: Upload samples and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: soak-results
          path: ${{ runner.temp }}/soak
