# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Unmaintained (not vulnerable) crates pulled in by Tauri's dependency tree; they
# only process build-time or trusted input. Revisit when Tauri drops them.
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error via gtk-rs (Tauri Linux backend), compile-time only" },
    { id = "RUSTSEC-2025-0075", reason = "unic-* via urlpattern (Tauri), unmaintained, no known vulnerability" },
    { id = "RUSTSEC-2025-0080", reason = "unic-* via urlpattern (Tauri), unmaintained, no known vulnerability" },
    { id = "RUSTSEC-2025-0081", reason = "unic-* via urlpattern (Tauri), unmaintained, no known vulnerability" },
    { id = "RUSTSEC-2025-0098", reason = "unic-* via urlpattern (Tauri), unmaintained, no known vulnerability" },
    { id = "RUSTSEC-2025-0100", reason = "unic-* via urlpattern (Tauri), unmaintained, no known vulnerability" },
]

[licenses]
version = 2
# Licenses compatible with distributing the whole as GPL-3.0-or-later.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "GPL-3.0-or-later",
    "ISC",
    "LGPL-2.1-or-later",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
